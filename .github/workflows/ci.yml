name: Crosslake checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Unit and HTTP regression tests (no cloud credentials)
        run: python -m unittest discover -s tests -v
      - name: Synthetic golden-suite smoke test
        run: python ci_runner.py samples/golden-suite/suite.json --mode fixtures --output suite-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: golden-smoke-results
          path: suite-results/
          retention-days: 7
